name: Daily AI Technology News

on:
  schedule:
    # 10:00 AM every day in the site owner's Eastern Time.
    - cron: "0 10 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Curate news with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_MODEL: gemini-3.5-flash-lite
        run: python scripts/update_news.py

      - name: Commit updated news feed
        run: |
          git config user.name "cryptoengineer-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-feed.js
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update daily AI technology news"
            git push
          fi
