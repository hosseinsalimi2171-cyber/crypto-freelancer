<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In / Sign Up | CryptoEngineer</title><style>
body{margin:0;background:#070a12;color:#f5f7ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:520px;margin:70px auto;padding:20px}.card{background:#0e1422;border:1px solid #283452;border-radius:18px;padding:28px}h1{margin-top:0}.muted{color:#a8b2c7}.input{width:100%;box-sizing:border-box;background:#090f1b;color:#fff;border:1px solid #34415d;border-radius:9px;padding:12px;margin:7px 0 13px}.btn{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,#8067ff,#a04cff);color:#fff;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1}.ghost{background:#0b1120;border:1px solid #394661}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#0a101c;border:1px solid #34415d}.ok{color:#52e09a}.bad{color:#ff6f8e}a{color:#18d5ff}</style></head><body><div class="wrap"><div class="card"><a href="index.html">← Back to CryptoEngineer</a><h1 id="title">Sign In</h1><p class="muted">Create an account to submit projects and send project requests.</p><div class="tabs"><button class="btn" id="signinTab">Sign In</button><button class="btn ghost" id="signupTab">Sign Up</button></div><form id="form"><label>Display name</label><input class="input" id="name" autocomplete="name" placeholder="Your name"><label>Email</label><input class="input" id="email" type="email" required autocomplete="email"><label>Password</label><input class="input" id="password" type="password" required minlength="6" autocomplete="current-password"><button class="btn" type="submit" id="submit">Sign In</button></form><div id="msg" class="msg" style="display:none"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>
let mode='signin';const nameEl=document.getElementById('name'),title=document.getElementById('title'),submit=document.getElementById('submit');
function setMode(m){mode=m;nameEl.style.display=m==='signup'?'block':'none';title.textContent=m==='signup'?'Create Account':'Sign In';submit.textContent=m==='signup'?'Create Account':'Sign In';}
document.getElementById('signinTab').onclick=()=>setMode('signin');document.getElementById('signupTab').onclick=()=>setMode('signup');setMode('signin');
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.style.display='block';msg.textContent='Working…';msg.className='msg';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=nameEl.value.trim();let result;if(mode==='signup'){result=await CryptoAuth.supabaseClient.auth.signUp({email,password,options:{data:{display_name:name}}});if(!result.error&&result.data.session===null)msg.innerHTML='<span class="ok">Account created.</span> Check your email to confirm the account, then sign in.';else if(!result.error) location.href='index.html';}else{result=await CryptoAuth.supabaseClient.auth.signInWithPassword({email,password});if(!result.error){const next=new URLSearchParams(location.search).get('next');location.href=next||'index.html';}}if(result.error){msg.innerHTML='<span class="bad">'+result.error.message+'</span>';}};
</script></body></html>
