<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Desk | CryptoEngineer</title><meta name="description" content="Curated technology and AI news from leading technology publications."><style>
:root{--bg:#070a12;--panel:#0d1422;--line:#27344f;--text:#f7f9ff;--muted:#a7b3c9;--cyan:#18d5ff;--purple:#8067ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#17133a,transparent 40%),#070a12;color:var(--text);font:15px/1.6 Inter,Segoe UI,Arial,sans-serif}.wrap{width:min(1180px,92%);margin:auto}a{color:inherit;text-decoration:none}nav{position:sticky;top:0;z-index:20;background:#070a12ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:20px;font-weight:900}.logo span{color:var(--cyan)}.links{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#c9d2e4}.btn{padding:10px 15px;border-radius:10px;border:1px solid #425071;background:linear-gradient(135deg,var(--purple),#a04cff);font-weight:800}.hero{padding:52px 0 25px}.eyebrow{display:inline-block;border:1px solid #3a496a;border-radius:999px;padding:5px 10px;color:#a9b8ff;font-size:11px;font-weight:800;letter-spacing:.6px}h1{font-size:clamp(38px,6vw,70px);line-height:1.02;margin:16px 0;background:linear-gradient(90deg,#fff,#baf7ff,#9e83ff);-webkit-background-clip:text;color:transparent}.lead{max-width:800px;color:var(--muted);font-size:18px}.story{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(13,20,34,.98),rgba(8,12,21,.98));transition:.2s}.story:hover{transform:translateY(-3px);border-color:#4c63a8}.story img{width:100%;height:190px;object-fit:cover;display:block;background:linear-gradient(135deg,#15213a,#27154a)}.story .body{padding:18px}.meta{display:flex;justify-content:space-between;color:#8190aa;font-size:11px;text-transform:uppercase;letter-spacing:.8px}.story h2,.story h3{line-height:1.25;margin:10px 0}.story p{color:var(--muted);margin:0 0 13px}.read{color:#78e7ff;font-weight:800}.feature{display:grid;grid-template-columns:1.2fr .8fr;gap:0}.feature img{height:100%;min-height:360px}.feature .body{padding:28px}.feature h2{font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.section{padding:22px 0 45px}.section h2{font-size:28px}.notice{padding:14px 17px;border-left:3px solid var(--cyan);background:#0a111d;border-radius:8px;color:#aebbd0;margin-top:18px}.source{color:#8e82ff;font-weight:800}footer{border-top:1px solid var(--line);padding:25px 0;color:#8491a8;font-size:13px}.detail{max-width:900px;margin:45px auto}.detail img{width:100%;max-height:520px;object-fit:cover;border-radius:20px;border:1px solid var(--line)}.detail .meta{margin-top:20px}.detail h1{font-size:clamp(34px,5vw,60px)}.detail .summary{font-size:20px;color:#c2ccde}.back{display:inline-block;margin:20px 0;color:#7de8ff;font-weight:800}.source-link{display:inline-block;margin-top:15px}.empty{padding:30px;border:1px dashed #3a496a;border-radius:16px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.feature{grid-template-columns:1fr}.feature img{min-height:220px;height:260px}}@media(max-width:600px){.links{display:none}.grid{grid-template-columns:1fr}.feature .body{padding:20px}}
</style></head><body><nav><div class="wrap nav"><a class="logo" href="index.html">Crypto<span>Engineer</span></a><div class="links"><a href="index.html">Home</a><a href="technology.html">Technology</a><a href="market.html">Market</a><a href="learning.html">Learning</a><a href="radar.html">Tech Radar</a></div><a class="btn" href="submit-project.html">Start a Project</a></div></nav><main class="wrap" id="app"></main><footer><div class="wrap">© 2026 CryptoEngineer · News summaries are original short descriptions. Full articles remain on their respective publications.</div></footer><script src="news-feed.js"></script><script>
const params=new URLSearchParams(location.search), id=params.get('story'); const item=window.CENews.find(x=>x.id===id); const app=document.getElementById('app');
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
if(item){app.innerHTML=`<article class="detail"><a class="back" href="technology.html">← Back to Technology Desk</a><div class="meta"><span>${esc(item.source)}</span><span>${esc(item.category)} · ${esc(item.date)}</span></div><h1>${esc(item.title)}</h1><img src="${item.image}" alt="${esc(item.title)}" onerror="this.style.display='none'"><p class="summary">${esc(item.summary)}</p><p>This page provides a concise editorial summary and sends readers to the original publication for the complete story. It does not reproduce the source article.</p><a class="btn source-link" href="${item.url}" target="_blank" rel="noopener noreferrer">Read the full story at ${esc(item.source)} →</a></article>`;}else{app.innerHTML=`<section class="hero"><span class="eyebrow">CRYPTOENGINEER NEWS DESK</span><h1>Technology & AI News</h1><p class="lead">Curated recent stories from the publications used by the Technology Desk.</p></section><section class="section"><div class="grid">${window.CENews.map(x=>`<a class="story" href="news.html?story=${x.id}"><img src="${x.image}" alt="" onerror="this.style.display='none'"><div class="body"><div class="meta"><span>${x.source}</span><span>${x.category}</span></div><h3>${x.title}</h3><p>${x.summary}</p><span class="read">Open story page →</span></div></a>`).join('')}</div></section>`;}
</script></body></html>
