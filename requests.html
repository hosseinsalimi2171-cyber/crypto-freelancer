<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Requests | CryptoEngineer</title><style>body{margin:0;background:#070a12;color:#f5f7ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#0e1422;border:1px solid #283452;border-radius:18px;padding:20px;margin-bottom:14px}.muted{color:#a8b2c7}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#1c1836;border:1px solid #514b83}.btn{border:0;border-radius:9px;padding:9px 13px;background:#8067ff;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}a{color:#18d5ff}</style></head><body><div class="wrap"><a href="index.html">← Home</a><h1>Project Requests</h1><p id="count" class="muted">Loading…</p><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>async function load(){if(!(await CryptoAuth.isAdmin())){document.body.innerHTML='<div class="wrap"><h1>Admin access required</h1><a href="index.html">Back to home</a></div>';return}const {data,error}=await CryptoAuth.supabaseClient.from('project_requests').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}document.getElementById('count').textContent=data.length+' total request(s)';document.getElementById('list').innerHTML=data.map(r=>`<div class="card"><div class="grid"><div><b>${escapeHtml(r.name)}</b><div class="muted">${escapeHtml(r.email)}${r.company?' · '+escapeHtml(r.company):''}</div></div><div><span class="badge">${escapeHtml(r.status)}</span><div class="muted">${new Date(r.created_at).toLocaleString()}</div></div></div><p>${escapeHtml(r.message)}</p><p class="muted">Budget: ${escapeHtml(r.budget||'—')} · Timeline: ${escapeHtml(r.timeline||'—')}</p><button class="btn" onclick="setStatus(${r.id},'reviewing')">Mark Reviewing</button> <button class="btn" onclick="setStatus(${r.id},'closed')">Close</button></div>`).join('')||'<div class="card">No requests yet.</div>'}function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function setStatus(id,status){const {error}=await CryptoAuth.supabaseClient.from('project_requests').update({status}).eq('id',id);if(error)alert(error.message);else load()}load();</script></body></html>
