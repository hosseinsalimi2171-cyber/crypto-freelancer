<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Requests | CryptoEngineer</title><style>body{margin:0;background:#070a12;color:#f5f7ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#0e1422;border:1px solid #283452;border-radius:18px;padding:20px;margin-bottom:14px}.muted{color:#a8b2c7}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#1c1836;border:1px solid #514b83}.btn{border:0;border-radius:9px;padding:9px 13px;background:#8067ff;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}a{color:#18d5ff}</style><style id="ce-theme">
:root{--ce-light-bg:#f4f7fb;--ce-light-panel:#ffffff;--ce-light-panel2:#eef3fa;--ce-light-line:#d8e0ec;--ce-light-text:#101827;--ce-light-muted:#5d6b82}
body.light-mode{background:var(--ce-light-bg)!important;color:var(--ce-light-text)!important;background-image:radial-gradient(circle at 10% 0%,rgba(128,103,255,.10),transparent 30%),radial-gradient(circle at 90% 0%,rgba(24,150,220,.09),transparent 28%)!important}
body.light-mode nav{background:rgba(255,255,255,.88)!important;border-bottom-color:var(--ce-light-line)!important}
body.light-mode .card,body.light-mode .quick,body.light-mode .livepanel,body.light-mode .demo,body.light-mode .market-card,body.light-mode .command-box{background:rgba(255,255,255,.92)!important;border-color:var(--ce-light-line)!important;color:var(--ce-light-text)!important}
body.light-mode .muted,body.light-mode .lead,body.light-mode footer{color:var(--ce-light-muted)!important}
body.light-mode .chip,body.light-mode .input,body.light-mode select,body.light-mode textarea,body.light-mode .output,body.light-mode .ghost{background:#f7f9fc!important;color:var(--ce-light-text)!important;border-color:#cbd5e3!important}
body.light-mode .table th,body.light-mode .table td{border-color:#dce3ed!important}
body.light-mode .ticker{background:#edf2f8!important;border-color:#d8e0ec!important}
body.light-mode .ticker-track{color:#4f6078!important}
body.light-mode .tech-watermark{opacity:.35}
.ce-theme-toggle{border:1px solid #3b4a68;background:#0c1321;color:#eaf1ff;border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:800;font-size:12px;display:inline-flex;gap:7px;align-items:center}
body.light-mode .ce-theme-toggle{background:#fff;color:#172033;border-color:#cbd5e3}
.ce-theme-icon{font-size:14px}.ce-theme-label{display:inline}
@media(max-width:900px){.ce-theme-label{display:none}}
</style></head><body><div class="wrap"><a href="index.html">← Home</a><h1>Project Requests</h1><p id="count" class="muted">Loading…</p><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>async function load(){if(!(await CryptoAuth.isAdmin())){document.body.innerHTML='<div class="wrap"><h1>Admin access required</h1><a href="index.html">Back to home</a></div>';return}const {data,error}=await CryptoAuth.supabaseClient.from('project_requests').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}document.getElementById('count').textContent=data.length+' total request(s)';document.getElementById('list').innerHTML=data.map(r=>`<div class="card"><div class="grid"><div><b>${escapeHtml(r.name)}</b><div class="muted">${escapeHtml(r.email)}${r.company?' · '+escapeHtml(r.company):''}</div></div><div><span class="badge">${escapeHtml(r.status)}</span><div class="muted">${new Date(r.created_at).toLocaleString()}</div></div></div><p>${escapeHtml(r.message)}</p><p class="muted">Budget: ${escapeHtml(r.budget||'—')} · Timeline: ${escapeHtml(r.timeline||'—')}</p><button class="btn" onclick="setStatus(${r.id},'reviewing')">Mark Reviewing</button> <button class="btn" onclick="setStatus(${r.id},'closed')">Close</button></div>`).join('')||'<div class="card">No requests yet.</div>'}function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function setStatus(id,status){const {error}=await CryptoAuth.supabaseClient.from('project_requests').update({status}).eq('id',id);if(error)alert(error.message);else load()}load();</script><script id="ce-theme-js">
(function(){const key='ce-theme';const body=document.body;function setTheme(mode){body.classList.toggle('light-mode',mode==='light');const b=document.getElementById('ceThemeToggle');if(b){b.setAttribute('aria-label',mode==='light'?'Switch to dark mode':'Switch to light mode');b.innerHTML='<span class="ce-theme-icon">'+(mode==='light'?'☀':'☾')+'</span><span class="ce-theme-label">'+(mode==='light'?'Light':'Dark')+'</span>'}localStorage.setItem(key,mode)}setTheme(localStorage.getItem(key)||'dark');window.ceToggleTheme=function(){setTheme(body.classList.contains('light-mode')?'dark':'light')};})();
</script></body></html>
