<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a Project | CryptoEngineer</title><style>body{margin:0;background:#070a12;color:#f5f7ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:760px;margin:45px auto;padding:20px}.card{background:#0e1422;border:1px solid #283452;border-radius:18px;padding:28px}.input,select,textarea{width:100%;box-sizing:border-box;background:#090f1b;color:#fff;border:1px solid #34415d;border-radius:9px;padding:12px;margin:7px 0 15px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,#8067ff,#a04cff);color:#fff;font-weight:800;cursor:pointer}.muted{color:#a8b2c7}.msg{padding:12px;border:1px solid #34415d;border-radius:10px;margin-top:15px}.ok{color:#52e09a}.bad{color:#ff6f8e}a{color:#18d5ff}</style></head><body><div class="wrap"><div class="card"><a href="index.html">← Home</a><h1>Submit Your Project</h1><p class="muted">Sign-in is required. Your submission is stored for review; it is not published automatically.</p><form id="form"><label>Project title</label><input class="input" id="title" required><label>Category</label><select id="category" required><option>Web3 Development</option><option>Python Engineering</option><option>Python Automation</option><option>Crypto Administration &amp; Operations</option><option>AI &amp; Intelligent Automation</option><option>DevOps &amp; Linux</option><option>Blockchain Engineering</option><option>DeFi Analytics</option><option>Crypto Research &amp; Analytics</option><option>UI/UX, Design &amp; Content</option><option>TypeScript Engineering</option><option>Web Design &amp; Frontend</option><option>UI/UX &amp; Product Design</option><option>Solidity Smart Contracts</option><option>Smart Contract Security</option><option>Ethereum Engineering</option><option>Solana Engineering</option><option>Layer-2 &amp; Rollup Engineering</option><option>Cross-Chain &amp; Interoperability</option><option>Crypto Wallet Engineering</option><option>Exchange &amp; Trading Systems</option><option>Quant Trading &amp; Strategy</option><option>Market Making &amp; Liquidity</option><option>Token Engineering &amp; Tokenomics</option><option>NFT Engineering &amp; Marketplaces</option><option>DAO &amp; Governance Engineering</option><option>Stablecoin Systems</option><option>Crypto Payments &amp; Checkout</option><option>Crypto Tax &amp; Accounting</option><option>Compliance, KYC &amp; AML</option><option>On-Chain Forensics &amp; Risk</option><option>Blockchain Data Engineering</option><option>Indexing &amp; GraphQL APIs</option><option>Oracles &amp; Data Feeds</option><option>MEV &amp; Transaction Optimization</option><option>Security Monitoring &amp; Threat Detection</option><option>Incident Response &amp; Recovery</option><option>Zero-Knowledge &amp; Privacy</option><option>MPC &amp; Account Abstraction</option><option>Rust Blockchain Engineering</option><option>Cosmos &amp; IBC Engineering</option><option>Polkadot &amp; Substrate Engineering</option><option>Avalanche Engineering</option><option>Polygon Engineering</option><option>Arbitrum, Base &amp; Optimism Engineering</option><option>Bitcoin &amp; Lightning Engineering</option><option>GameFi &amp; Metaverse</option><option>Crypto Social &amp; Community</option><option>Crypto Marketing &amp; Growth</option><option>Technical Documentation &amp; Developer Relations</option></select><label>Description</label><textarea class="input" id="description" rows="7" required></textarea><label>Project URL (optional)</label><input class="input" id="url" type="url" placeholder="https://..."><button class="btn">Submit Project</button></form><div id="msg" class="msg" style="display:none"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>CryptoAuth.requireUser().then(user=>{if(!user)return;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const {error}=await CryptoAuth.supabaseClient.from('project_submissions').insert({user_id:user.id,title:document.getElementById('title').value.trim(),category:document.getElementById('category').value,description:document.getElementById('description').value.trim(),project_url:document.getElementById('url').value.trim()||null});msg.style.display='block';msg.innerHTML=error?'<span class="bad">'+error.message+'</span>':'<span class="ok">Submitted successfully. Your project is pending review.</span>';if(!error)e.target.reset();};});</script></body></html>
